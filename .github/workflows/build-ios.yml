name: Build TextLector IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26

    env:
      GITHUB_TOKEN: ${{ secrets.SUPERTONIC_GITHUB_TOKEN }}

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. Select Xcode 26.0.1
      # ============================================================

      - name: Select Xcode 26.0.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Swift ==="
          swift --version


      # ============================================================
      # 3. Java 21
      # ============================================================

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 4. Prepare Gradle
      # ============================================================

      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew

          cat > local.properties <<'EOF'
          KEYSTORE_PASSWORD=dummy
          KEY_PASSWORD=dummy
          EOF

          sed -i.bak \
            's/networkTimeout=10000/networkTimeout=120000/' \
            gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 5. Cheap preflight
      #
      # IMPORTANT:
      # This happens BEFORE the 12-minute Sherpa compilation.
      # If the Xcode project is broken, we fail here in seconds.
      # ============================================================

      - name: Preflight Xcode project
        run: |
          set -e

          echo "=== Checking Xcode project ==="

          xcodebuild \
            -list \
            -project iosApp/iosApp.xcodeproj

          echo ""
          echo "=== Checking iosApp target ==="

          xcodebuild \
            -showBuildSettings \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            > build-settings.txt

          grep "PRODUCT_NAME" build-settings.txt || true
          grep "IPHONEOS_DEPLOYMENT_TARGET" build-settings.txt || true

          echo ""
          echo "=== Checking for accidental developer paths ==="

          if grep -R \
            "/Users/denis/AndroidStudioProjects" \
            iosApp/iosApp.xcodeproj/project.pbxproj; then

            echo ""
            echo "ERROR: Personal developer path is still present in project.pbxproj."
            exit 1
          fi

          echo "✅ No hard-coded developer path found."


      # ============================================================
      # 6. Verify Gradle
      # ============================================================

      - name: Verify Gradle
        run: |
          ./gradlew --version


      # ============================================================
      # 7. Restore cached Sherpa XCFramework
      #
      # This prevents future runs from rebuilding Sherpa for ~12 min.
      # ============================================================

      - name: Restore Sherpa XCFramework cache
        id: sherpa-cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/sherpa-onnx.xcframework
          key: sherpa-ios-1.12.34-xcode26-${{ runner.arch }}


      # ============================================================
      # 8. Build Sherpa only when cache is missing
      # ============================================================

      - name: Build sherpa-onnx XCFramework
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/sherpa-onnx"

          git clone \
            --depth 1 \
            --branch v1.12.34 \
            https://github.com/k2-fsa/sherpa-onnx.git \
            "$GITHUB_WORKSPACE/sherpa-onnx"

          cd "$GITHUB_WORKSPACE/sherpa-onnx"

          chmod +x build-ios.sh

          ./build-ios.sh

          SHERPA_XCFRAMEWORK="$(
            find "$GITHUB_WORKSPACE/sherpa-onnx" \
              -type d \
              -name "sherpa-onnx.xcframework" \
              -print -quit
          )"

          if [ -z "$SHERPA_XCFRAMEWORK" ]; then
            echo "ERROR: sherpa-onnx.xcframework was not created."
            exit 1
          fi

          echo "Found:"
          echo "$SHERPA_XCFRAMEWORK"

          mkdir -p \
            "$GITHUB_WORKSPACE/.ci-cache"

          rm -rf \
            "$GITHUB_WORKSPACE/.ci-cache/sherpa-onnx.xcframework"

          cp -R \
            "$SHERPA_XCFRAMEWORK" \
            "$GITHUB_WORKSPACE/.ci-cache/sherpa-onnx.xcframework"


      # ============================================================
      # 9. Save Sherpa cache
      # ============================================================

      - name: Save Sherpa XCFramework cache
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/sherpa-onnx.xcframework
          key: sherpa-ios-1.12.34-xcode26-${{ runner.arch }}


      # ============================================================
      # 10. Install Sherpa into TextLector
      # ============================================================

      - name: Install Sherpa XCFramework
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/iosApp/Frameworks"

          rm -rf \
            "$GITHUB_WORKSPACE/iosApp/Frameworks/sherpa-onnx.xcframework"

          cp -R \
            "$GITHUB_WORKSPACE/.ci-cache/sherpa-onnx.xcframework" \
            "$GITHUB_WORKSPACE/iosApp/Frameworks/sherpa-onnx.xcframework"

          echo "=== Installed framework ==="

          ls -lah \
            "$GITHUB_WORKSPACE/iosApp/Frameworks"

          test -d \
            "$GITHUB_WORKSPACE/iosApp/Frameworks/sherpa-onnx.xcframework"


      # ============================================================
      # 11. Build the actual iOS application
      #
      # IMPORTANT:
      #
      # We intentionally use:
      #   -target iosApp
      #   -sdk iphoneos
      #
      # We intentionally DO NOT use:
      #   -scheme
      #   -derivedDataPath
      #
      # This matches the invocation that previously got through
      # Xcode's dependency graph and into compilation.
      # ============================================================

      - name: Build iOS app
        run: |
          set -o pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/build/Release-iphoneos"

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            -skipPackagePluginValidation \
            build \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/build/xcodebuild.log"


      # ============================================================
      # 12. Show useful log if build fails
      # ============================================================

      - name: Show Xcode errors on failure
        if: failure()
        run: |
          echo "============================================================"
          echo "XCODE ERRORS"
          echo "============================================================"

          if [ -f "$GITHUB_WORKSPACE/build/xcodebuild.log" ]; then
            grep -n -B 5 -A 15 \
              -E "error:|fatal error:|FAILED|Execution failed" \
              "$GITHUB_WORKSPACE/build/xcodebuild.log" \
              || true
          fi


      # ============================================================
      # 13. Locate app
      # ============================================================

      - name: Locate TextLector.app
        run: |
          APP_PATH="$(
            find "$GITHUB_WORKSPACE/build" \
              -type d \
              -name "TextLector.app" \
              -print -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: TextLector.app was not produced."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" \
            >> "$GITHUB_ENV"

          echo "✅ Found:"
          echo "$APP_PATH"


      # ============================================================
      # 14. Verify iOS minimum version
      # ============================================================

      - name: Verify iOS 15 target
        run: |
          echo "=== App binary ==="

          otool -l \
            "$APP_PATH/TextLector" \
            | grep -A 5 LC_BUILD_VERSION \
            || true


      # ============================================================
      # 15. Inspect Supertonic resources
      #
      # We don't fail the build here yet.
      # First priority is producing a valid app.
      # ============================================================

      - name: Check Supertonic resources
        run: |
          echo "=== Searching for Supertonic resources ==="

          find "$GITHUB_WORKSPACE/composeApp/build" \
            -type d \
            -path "*/SupertonicKMP.framework/supertonic" \
            -print \
            2>/dev/null \
            | head -20 \
            || true

          if [ -d "$APP_PATH/supertonic" ]; then
            echo "✅ Supertonic resources are in the app bundle."
          else
            echo "⚠️ Supertonic resources are not currently in the app bundle."
          fi


      # ============================================================
      # 16. Create unsigned IPA
      # ============================================================

      - name: Package IPA
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/ipa"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/TextLector.app"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            TextLector-iOS15.ipa \
            Payload

          echo "============================================================"
          echo "✅ IPA CREATED"
          echo "============================================================"

          ls -lh \
            TextLector-iOS15.ipa


      # ============================================================
      # 17. Upload IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: TextLector-iOS15-IPA
          path: ipa/TextLector-iOS15.ipa
          if-no-files-found: error
          retention-days: 7
