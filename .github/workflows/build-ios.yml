name: Build TextLector IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26

    env:
      GITHUB_TOKEN: ${{ secrets.SUPERTONIC_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.0.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Gradle environment
        run: |
          chmod +x ./gradlew

          # TextLector requires local.properties during Gradle configuration.
          # The file is intentionally gitignored.
          cat > local.properties <<'EOF'
          KEYSTORE_PASSWORD=dummy
          KEY_PASSWORD=dummy
          EOF

          # The repo currently uses only a 10-second Gradle wrapper timeout.
          # GitHub-hosted runners normally have fast networking, but this
          # makes the build less fragile.
          sed -i.bak 's/networkTimeout=10000/networkTimeout=120000/' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle
        run: |
          ./gradlew --version

      - name: Resolve Swift packages
        working-directory: iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -resolvePackageDependencies

      - name: Build iOS app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate app
        run: |
          echo "Searching for TextLector.app..."
          find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "TextLector.app" \
            -print

      - name: Verify iOS deployment target
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -name "TextLector.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: TextLector.app was not produced."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH"

          otool -l "$APP_PATH/TextLector" \
            | grep -A3 LC_BUILD_VERSION || true

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -name "TextLector.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: TextLector.app was not produced."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/TextLector.app"

          cd "$GITHUB_WORKSPACE/ipa"
          zip -qry TextLector-iOS15.ipa Payload

          echo "Created:"
          ls -lh TextLector-iOS15.ipa

      - name: Check Supertonic resources
        run: |
          APP_PATH="$GITHUB_WORKSPACE/ipa/Payload/TextLector.app"

          echo "Looking for bundled Supertonic resources..."

          if [ -d "$APP_PATH/supertonic" ]; then
            echo "Supertonic resources FOUND:"
            find "$APP_PATH/supertonic" -maxdepth 2 -type f | head -50
          else
            echo "WARNING: Supertonic resources were NOT found in the app bundle."
            echo "The IPA will still be uploaded so we can inspect the build."
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: TextLector-iOS15-IPA
          path: ipa/TextLector-iOS15.ipa
          if-no-files-found: error
          retention-days: 7
